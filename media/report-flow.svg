<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">CiviFold: from report to decision</title>
  <desc id="desc">A resident sends a photo, text or voice (voice is transcribed by Muse Voice Transcribe). Muse Spark reads the words; rules route emergencies and reports about people straight to staff and ask for a photo when there is none. Photos go through triage (Muse Spark), a search for incidents within 40 m (rules), cut-outs (SAM 3.1; for road damage and dumped piles, Muse Spark boxes the thing first) and comparison (Muse Spark, no timestamps). Rules apply the repair record and require two observations, then suggest duplicate, late report, already fixed, possible recurrence, new problem, one question to the resident, or staff review. Every outcome is a suggestion that staff decide on; staff may ask the agent to look for evidence against a closing suggestion.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #475569; }
      .sub { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #64748b; }
      .heading { font-size: 15px; font-weight: 650; fill: #0f172a; }
      .body { font-size: 13px; fill: #334155; }
      .small { font-size: 12px; fill: #64748b; }
      .pill { font-size: 11px; font-weight: 600; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#blue-arrow); }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
  <rect width="960" height="620" rx="20" fill="#f8fafc"/>

  <text x="32" y="36" class="label">CIVIFOLD / FROM REPORT TO DECISION</text>
  <text x="32" y="56" class="small">Three ways to report, one path to a suggestion, and staff decide every time.</text>

  <!-- The one question a report can get: the resident answers, and the report is read again. -->
  <path d="M928 384 H944 V82 H180 V106" class="optional"/>
  <text x="540" y="75" class="small" text-anchor="middle" style="fill:#1d4ed8">Asks once: the resident answers with a photo or the time, and the report is read again</text>

  <text x="32" y="98" class="label">1 · THE REPORT</text>
  <text x="262" y="98" class="label">2 · READ AND ROUTE</text>
  <text x="492" y="98" class="label">3 · COMPARE PHOTOS</text>
  <text x="722" y="98" class="label">4 · DECIDE</text>

  <!-- 1. The report -->
  <rect x="32" y="108" width="206" height="74" rx="10" class="card"/>
  <text x="46" y="132" class="heading">Photo</text>
  <text x="46" y="152" class="body">Place and time read from</text>
  <text x="46" y="169" class="body">the photo or the map pin</text>

  <rect x="32" y="192" width="206" height="74" rx="10" class="card"/>
  <text x="46" y="216" class="heading">Text</text>
  <text x="46" y="236" class="body">A typed note, in any</text>
  <text x="46" y="253" class="body">language</text>

  <rect x="32" y="276" width="206" height="74" rx="10" class="card"/>
  <text x="46" y="300" class="heading">Voice</text>
  <rect x="46" y="308" width="150" height="18" rx="9" fill="#d1fae5"/>
  <text x="121" y="321" class="pill" text-anchor="middle" fill="#065f46">Muse Voice Transcribe</text>
  <text x="46" y="343" class="body">turns it into text</text>

  <rect x="32" y="362" width="206" height="58" rx="10" fill="#fffbeb" stroke="#d6b764" stroke-width="1.5"/>
  <text x="46" y="384" class="heading" style="font-size:13.5px">Danger tick</text>
  <text x="46" y="403" class="small">“someone may be in danger”</text>

  <path d="M238 145 H260" class="line"/>
  <path d="M238 229 H260" class="line"/>
  <path d="M238 313 H260" class="line"/>

  <!-- 2. Read and route -->
  <rect x="262" y="108" width="206" height="312" rx="10" class="card"/>
  <text x="276" y="132" class="label">WORDS</text>
  <rect x="373" y="118" width="81" height="18" rx="9" fill="#dbeafe"/>
  <text x="413.5" y="131" class="pill" text-anchor="middle" fill="#1e40af">Muse Spark</text>
  <text x="276" y="154" class="body">Reads the note or the</text>
  <text x="276" y="171" class="body">transcript: emergency?</text>
  <text x="276" y="188" class="body">people or behavior? what,</text>
  <text x="276" y="205" class="body">where, landmarks</text>
  <line x1="276" y1="222" x2="454" y2="222" class="divider"/>
  <text x="276" y="246" class="label">ROUTE</text>
  <rect x="404" y="232" width="50" height="18" rx="9" fill="#e2e8f0"/>
  <text x="429" y="245" class="pill" text-anchor="middle" fill="#334155">Rules</text>
  <text x="276" y="270" class="body">Emergency → staff, at once</text>
  <text x="276" y="292" class="body">People, behavior → staff</text>
  <text x="276" y="314" class="body">No photo → asks for one</text>
  <text x="276" y="336" class="body">Photo, in scope → compare</text>
  <text x="276" y="372" class="small">Without a photo nothing is</text>
  <text x="276" y="389" class="small">matched; staff see the</text>
  <text x="276" y="406" class="small">incidents nearby instead.</text>

  <path d="M468 264 H490" class="line"/>

  <!-- 3. Compare photos -->
  <rect x="492" y="108" width="206" height="312" rx="10" class="card"/>
  <text x="506" y="132" class="heading" style="font-size:14px">1 · Triage</text>
  <rect x="603" y="118" width="81" height="18" rx="9" fill="#dbeafe"/>
  <text x="643.5" y="131" class="pill" text-anchor="middle" fill="#1e40af">Muse Spark</text>
  <text x="506" y="151" class="body">What it shows, is it usable,</text>
  <text x="506" y="168" class="body">damage or repair signs</text>

  <text x="506" y="196" class="heading" style="font-size:14px">2 · Search nearby</text>
  <rect x="634" y="182" width="50" height="18" rx="9" fill="#e2e8f0"/>
  <text x="659" y="195" class="pill" text-anchor="middle" fill="#334155">Rules</text>
  <text x="506" y="215" class="body">Incidents within 40 m,</text>
  <text x="506" y="232" class="body">the nearest five</text>

  <text x="506" y="260" class="heading" style="font-size:14px">3 · Cut-outs</text>
  <rect x="622" y="246" width="62" height="18" rx="9" fill="#ede9fe"/>
  <text x="653" y="259" class="pill" text-anchor="middle" fill="#5b21b6">SAM 3.1</text>
  <text x="506" y="279" class="body">The object and surroundings;</text>
  <text x="506" y="296" class="body">Spark boxes damage, piles</text>

  <text x="506" y="324" class="heading" style="font-size:14px">4 · Compare</text>
  <rect x="603" y="310" width="81" height="18" rx="9" fill="#dbeafe"/>
  <text x="643.5" y="323" class="pill" text-anchor="middle" fill="#1e40af">Muse Spark</text>
  <text x="506" y="343" class="body">Full photos and cut-outs:</text>
  <text x="506" y="360" class="body">same fixture? same problem?</text>
  <text x="506" y="377" class="body">repair signs? No timestamps.</text>
  <text x="506" y="402" class="small">Both views, every candidate</text>

  <path d="M698 264 H720" class="line"/>

  <!-- 4. Decide -->
  <rect x="722" y="108" width="206" height="312" rx="10" class="card"/>
  <text x="736" y="132" class="label">NO MODEL</text>
  <rect x="864" y="118" width="50" height="18" rx="9" fill="#e2e8f0"/>
  <text x="889" y="131" class="pill" text-anchor="middle" fill="#334155">Rules</text>
  <text x="736" y="154" class="body">Observation time against</text>
  <text x="736" y="171" class="body">the repair record.</text>
  <text x="736" y="188" class="body">A closing label needs two</text>
  <text x="736" y="205" class="body">independent observations.</text>
  <line x1="736" y1="222" x2="914" y2="222" class="divider"/>
  <text x="736" y="244" class="sub">WOULD CLOSE THE REPORT</text>
  <circle cx="742" cy="258" r="5" fill="#38bdf8"/><text x="754" y="262" class="body">Duplicate</text>
  <circle cx="742" cy="278" r="5" fill="#818cf8"/><text x="754" y="282" class="body">Late report</text>
  <circle cx="742" cy="298" r="5" fill="#34d399"/><text x="754" y="302" class="body">Already fixed</text>
  <text x="736" y="328" class="sub">KEEPS IT OPEN</text>
  <circle cx="742" cy="342" r="5" fill="#fb7185"/><text x="754" y="346" class="body">Possible recurrence</text>
  <circle cx="742" cy="362" r="5" fill="#a1a1aa"/><text x="754" y="366" class="body">New problem</text>
  <circle cx="742" cy="382" r="5" fill="#a78bfa"/><text x="754" y="386" class="body">Ask the resident once</text>
  <circle cx="742" cy="402" r="5" fill="#fbbf24"/><text x="754" y="406" class="body">Staff review</text>

  <!-- Down to staff -->
  <path d="M135 420 V468" class="line"/>
  <text x="143" y="448" class="small">at once</text>
  <path d="M365 420 V468" class="line"/>
  <text x="373" y="448" class="small">straight to staff</text>
  <path d="M825 420 V468" class="line"/>
  <text x="833" y="448" class="small">as a suggestion</text>

  <!-- 5. Staff -->
  <rect x="32" y="470" width="896" height="112" rx="12" fill="#0f172a"/>
  <text x="48" y="494" class="label" style="fill:#cbd5e1">5 · STAFF DECIDE</text>
  <text x="48" y="520" class="heading" style="fill:#fff;font-size:17px">Every outcome is a suggestion.</text>
  <text x="48" y="544" class="body" style="fill:#cbd5e1;font-size:13.5px">Staff link, open a new incident, mark a recurrence, ask or dismiss.</text>
  <text x="48" y="562" class="body" style="fill:#cbd5e1;font-size:13.5px">Nothing is linked or closed by itself.</text>

  <rect x="520" y="480" width="396" height="92" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="534" y="500" class="sub" style="fill:#93c5fd">OPTIONAL · VERIFY WITH THE AGENT</text>
  <rect x="827" y="488" width="81" height="18" rx="9" fill="#dbeafe"/>
  <text x="867.5" y="501" class="pill" text-anchor="middle" fill="#1e40af">Muse Spark</text>
  <text x="534" y="522" class="body" style="fill:#f1f5f9">Looks for evidence against a</text>
  <text x="534" y="539" class="body" style="fill:#f1f5f9">closing suggestion with the same</text>
  <text x="534" y="556" class="body" style="fill:#f1f5f9">tools. It can only make it more cautious.</text>

  <text x="32" y="606" class="small">Blue, violet and green pills are Meta models. Gray pills are rules that call no model.</text>
</svg>
