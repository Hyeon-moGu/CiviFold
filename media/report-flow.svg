<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1090" viewBox="0 0 960 1090" role="img" aria-labelledby="title desc">
  <title id="title">CiviFold: from report to staff review</title>
  <desc id="desc">Reports are screened before photo matching. Emergencies and out-of-scope reports go to staff; missing photos lead to a request, a new suggestion or staff review. Eligible photos are compared, rules apply time and evidence requirements, and staff review the suggestion. Verification is optional and occurs before staff approval.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; fill: #475569; }
      .heading { font-size: 25px; font-weight: 650; fill: #0f172a; }
      .body { font-size: 18px; fill: #334155; }
      .small { font-size: 16px; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#blue-arrow); }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="960" height="1090" rx="20" fill="#f8fafc"/>
  <text x="40" y="43" class="label">CIVIFOLD / REPORT WORKFLOW</text>
  <text x="40" y="72" class="small">A suggestion reaches staff before any report is linked or closed.</text>

  <rect x="40" y="98" width="520" height="110" rx="12" class="card"/>
  <text x="64" y="126" class="label">01 / RECEIVE</text>
  <text x="64" y="157" class="heading">Photo, text or voice</text>
  <text x="64" y="185" class="body">Voice becomes text for the same intake flow.</text>
  <path d="M300 208 V244" class="line"/>

  <rect x="40" y="244" width="520" height="116" rx="12" class="card"/>
  <text x="64" y="273" class="label">02 / ROUTE</text>
  <text x="64" y="305" class="heading">Check urgency, scope and photo</text>
  <text x="64" y="334" class="body">Screen the message and resident's danger flag.</text>

  <path d="M560 277 H630" class="line"/>
  <rect x="638" y="222" width="282" height="124" rx="12" fill="#fffbeb" stroke="#d6b764" stroke-width="1.5"/>
  <text x="658" y="252" class="label">DIRECT TO STAFF</text>
  <text x="658" y="284" class="body" font-weight="600">Emergency → priority queue</text>
  <text x="658" y="313" class="small">People or behavior → review</text>

  <path d="M560 330 H602 V421 H630" class="line"/>
  <rect x="638" y="374" width="282" height="144" rx="12" class="card"/>
  <text x="658" y="404" class="label">NO PHOTO</text>
  <text x="658" y="435" class="body">Ask for a photo when nearby</text>
  <text x="658" y="460" class="body">incidents need distinguishing.</text>
  <text x="658" y="490" class="small">Or propose new / send to staff</text>

  <path d="M300 360 V422" class="line"/>
  <rect x="151" y="377" width="298" height="26" fill="#f8fafc"/>
  <text x="300" y="395" class="small" text-anchor="middle">In scope, with a usable photo</text>

  <rect x="40" y="430" width="520" height="128" rx="12" class="card"/>
  <text x="64" y="460" class="label">03 / COMPARE</text>
  <text x="64" y="492" class="heading">Same fixture? Same visible problem?</text>
  <text x="64" y="524" class="body">Nearby candidates · full photos + SAM crops</text>
  <path d="M300 558 V594" class="line"/>

  <rect x="40" y="594" width="520" height="128" rx="12" class="card"/>
  <text x="64" y="624" class="label">04 / APPLY RULES</text>
  <text x="64" y="656" class="heading">Combine evidence with repair history</text>
  <text x="64" y="688" class="body">Observation time · repair time · enough evidence?</text>
  <text x="658" y="605" class="label">KEEP THE ROLES CLEAR</text>
  <text x="658" y="636" class="body">Vision compares what is visible.</text>
  <text x="658" y="664" class="body">Rules apply the timestamps.</text>
  <text x="658" y="692" class="body">Staff decide what happens.</text>
  <path d="M300 722 V770" class="line"/>

  <rect x="40" y="770" width="520" height="128" rx="12" fill="#eff6ff" stroke="#93b4e8" stroke-width="1.5"/>
  <text x="64" y="800" class="label">05 / STAFF REVIEW</text>
  <text x="64" y="832" class="heading">Review the suggestion and evidence</text>
  <text x="64" y="864" class="body">Link · new problem · recurrence · question / review</text>

  <path d="M560 810 H630" class="optional"/>
  <path d="M638 867 H568" class="optional"/>
  <rect x="638" y="760" width="282" height="184" rx="12" fill="#eff6ff" stroke="#93b4e8" stroke-width="1.5"/>
  <text x="658" y="789" class="label" style="fill:#1d4ed8">OPTIONAL / EXPERIMENTAL</text>
  <text x="658" y="823" class="heading" style="font-size:23px">Verification agent</text>
  <text x="658" y="852" class="body">Staff request a check of a</text>
  <text x="658" y="877" class="body">duplicate, late or fixed report.</text>
  <text x="658" y="907" class="small">Rules recheck the evidence.</text>
  <text x="658" y="930" class="small">Same or more cautious result.</text>

  <path d="M300 898 V966" class="line"/>
  <rect x="40" y="966" width="520" height="76" rx="12" fill="#0f172a"/>
  <text x="300" y="997" text-anchor="middle" font-size="21" font-weight="650" fill="#fff">Staff approve the action</text>
  <text x="300" y="1024" text-anchor="middle" font-size="17" fill="#cbd5e1">No automatic linking or closing</text>
</svg>
