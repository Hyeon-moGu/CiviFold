name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11, which writes package-lock.json locally; npm 10 (Node 22) reads a few optional
      # entries differently and refuses the file as out of sync.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Tests use an in-memory Postgres and recorded model replies: no API key, no network.
      - run: npm test
      # The production build, with no environment: it must not need a database or a key to compile.
      - run: npm run build
